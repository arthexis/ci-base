name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for lint, build, and install checks
        required: false
        type: string
        default: "3.14"
      test-python-versions:
        description: JSON array of Python versions used for the test matrix
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      install-command:
        description: Command used to install the project before tests
        required: false
        type: string
        default: python -m pip install -e .
      test-command:
        description: Command used to run tests
        required: false
        type: string
        default: python -m pytest
      lint-paths:
        description: Paths passed to Ruff
        required: false
        type: string
        default: .
      run-build:
        description: Build wheel and sdist
        required: false
        type: boolean
        default: true
      run-install-check:
        description: Install the built wheel in a clean virtual environment
        required: false
        type: boolean
        default: true
      install-smoke-command:
        description: Optional commands to run inside the clean wheel-install environment
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff
      - name: Install project
        run: ${{ inputs.install-command }}
      - name: Ruff lint
        run: python -m ruff check ${{ inputs.lint-paths }}
      - name: Ruff format
        run: python -m ruff format --check ${{ inputs.lint-paths }}

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.test-python-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CI tools
        run: python -m pip install --upgrade pip pytest
      - name: Install project
        run: ${{ inputs.install-command }}
      - name: Tests
        run: ${{ inputs.test-command }}

  package:
    name: Package
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Check distributions exist
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
      - name: Clean wheel install
        if: inputs.run-install-check
        shell: bash
        run: |
          python -m venv /tmp/ci-base-install
          /tmp/ci-base-install/bin/python -m pip install --upgrade pip
          /tmp/ci-base-install/bin/python -m pip install dist/*.whl
          /tmp/ci-base-install/bin/python -m pip check
      - name: Installed package smoke check
        if: inputs.run-install-check && inputs.install-smoke-command != ''
        shell: bash
        run: |
          source /tmp/ci-base-install/bin/activate
          ${{ inputs.install-smoke-command }}
