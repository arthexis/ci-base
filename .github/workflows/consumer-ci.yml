name: Consumer CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for lint, build, and install checks
        required: false
        type: string
        default: "3.14"
      test-python-versions:
        description: JSON array of Python versions used for tests
        required: false
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'
      working-directory:
        description: Project directory relative to the repository root
        required: false
        type: string
        default: .
      install-command:
        description: Command used to install the project and test dependencies
        required: false
        type: string
        default: python -m pip install -e .
      test-command:
        description: Command used to run tests
        required: false
        type: string
        default: python -m pytest
      lint-paths:
        description: Paths passed to Ruff
        required: false
        type: string
        default: .
      run-build:
        description: Build wheel and sdist
        required: false
        type: boolean
        default: true
      run-install-check:
        description: Install the built wheel in a clean environment and run pip check
        required: false
        type: boolean
        default: true
      install-smoke-command:
        description: Optional commands to run inside the clean wheel-install environment
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  branch-current:
    name: Branch current
    runs-on: ubuntu-latest
    steps:
      - name: Freshness check not required outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Branch freshness is only checked for pull requests."
      - name: Check out pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require pull request branch to contain current base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if ! git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "::error::Pull request branch is behind $BASE_REF. Update the branch before running CI."
            exit 1
          fi

  python:
    needs: branch-current
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/python-ci.yml
    with:
      python-version: ${{ inputs.python-version }}
      test-python-versions: ${{ inputs.test-python-versions }}
      working-directory: ${{ inputs.working-directory }}
      install-command: ${{ inputs.install-command }}
      test-command: ${{ inputs.test-command }}
      lint-paths: ${{ inputs.lint-paths }}
      run-build: ${{ inputs.run-build }}
      run-install-check: ${{ inputs.run-install-check }}
      install-smoke-command: ${{ inputs.install-smoke-command }}
