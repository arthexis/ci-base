name: Update PR branches

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pr-branches-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update internal PR branches behind main
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "main",
              per_page: 100,
            });

            for (const pr of prs) {
              if (pr.head.repo?.full_name !== repository) {
                core.info(`Skipping PR #${pr.number}: head is external (${pr.head.repo?.full_name ?? "unknown"})`);
                continue;
              }

              const { data: details } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });

              if (details.mergeable_state !== "behind") {
                core.info(`Skipping PR #${pr.number}: ${details.mergeable_state}`);
                continue;
              }

              core.info(`Updating PR #${pr.number}: ${pr.head.ref}`);

              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                  expected_head_sha: pr.head.sha,
                });
              } catch (error) {
                core.warning(`Could not update PR #${pr.number}: ${error.message}`);
              }
            }
