name: Template Self Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Compile tooling
        run: python -m py_compile .ci/check_repo.py audit.py
      - name: Validate template files
        run: python .ci/check_repo.py --template
      - name: Run audit contract tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/test_audit.py
      - name: Exercise audit against template workflows
        run: |
          mkdir -p /tmp/ci-base-audit/.github/workflows
          cp templates/workflows/*.yml /tmp/ci-base-audit/.github/workflows/
          python audit.py /tmp/ci-base-audit --no-ruleset
