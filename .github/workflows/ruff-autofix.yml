name: Ruff Autofix

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root
        required: false
        type: string
        default: .
      lint-paths:
        description: Paths passed to Ruff
        required: false
        type: string
        default: .

permissions:
  contents: write

jobs:
  autofix:
    name: Ruff autofix
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out internal pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Apply safe Ruff fixes
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m ruff check ${{ inputs.lint-paths }} --fix --exit-zero
          python -m ruff format ${{ inputs.lint-paths }}
      - name: Commit fixes
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No Ruff changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply Ruff autofixes"
          git push origin "HEAD:$HEAD_REF"
