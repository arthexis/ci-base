name: Sync v1

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-v1
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'arthexis/ci-base'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Point v1 at main
        shell: bash
        run: git push --force origin "$GITHUB_SHA:refs/heads/v1"
