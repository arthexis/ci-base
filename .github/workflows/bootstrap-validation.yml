name: Bootstrap validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test generator and deployment contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_bootstrap.py
          python -m py_compile bootstrap.py
      - name: Generate a clean project
        run: |
          python bootstrap.py sample-app --ansible --output /tmp/sample-app
          python .ci/check_repo.py /tmp/sample-app
          python -m pip install -e /tmp/sample-app
          python -m pytest -q /tmp/sample-app/tests
      - name: Validate Ansible syntax in generated project
        run: |
          python -m pip install ansible-core
          cd /tmp/sample-app
          ansible-playbook -i ansible/inventory/localhost.yml ansible/playbooks/install.yml --syntax-check
          ansible-playbook -i ansible/inventory/localhost.yml ansible/playbooks/verify.yml --syntax-check
