name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    if: github.repository != 'arthexis/ci-base'
    uses: arthexis/ci-base/.github/workflows/consumer-ci.yml@v1
